image: "redoxos/redoxer"

stages:
    - clippy
    - build
    - test

cache:
    paths:
        - target/

clippy:redox:
    stage: clippy
    script: redoxer clippy

build:redox:
    stage: build
    script: redoxer build --verbose

test:redox:
    stage: test
    dependencies:
        - build:redox
    script: redoxer test --verbose
